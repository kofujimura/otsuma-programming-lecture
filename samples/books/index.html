<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Search App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Google Books</h1>
      <div class="searchbar">
        <input
          type="text"
          id="searchInput"
          placeholder="本のタイトルか著者名を入力してください"
        />
        <button id="searchButton">検索</button>
      </div>
      <div id="results"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
