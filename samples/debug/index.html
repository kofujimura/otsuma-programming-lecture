<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>デバッグ練習</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>デバッグ練習</h1>
      <p>8つのボタンは、どれも正しく動きません。デベロッパーツールの Console を開いてからボタンを押し、script.js を直してください。</p>
    </header>
    <main>
      <section>
        <h2>① 押した回数を数える</h2>
        <button id="btn1">数える</button>
        <p id="out1"></p>
      </section>
      <section>
        <h2>② 点数をランダムに決めて、100点のときだけ「満点！」と出す</h2>
        <button id="btn2">点数を決める</button>
        <p id="out2"></p>
      </section>
      <section>
        <h2>③ 押すたびに10点ずつ増える</h2>
        <button id="btn3">10点追加</button>
        <p id="out3"></p>
      </section>
      <section>
        <h2>④ 本の一覧を表示する（3冊）</h2>
        <button id="btn4">一覧を表示</button>
        <ul id="out4"></ul>
      </section>
      <section>
        <h2>⑤ 入力した名前で、あいさつを表示する</h2>
        <input id="name" type="text" placeholder="名前" />
        <button id="btn5">あいさつ</button>
        <p id="out5"></p>
      </section>
      <section>
        <h2>⑥ 今日の日付を表示する</h2>
        <button id="btn6">日付を表示</button>
        <p id="out6"></p>
      </section>
      <section>
        <h2>⑦ メモを保存して、保存した件数を表示する</h2>
        <input id="memo" type="text" placeholder="メモ" />
        <button id="btn7">保存</button>
        <p id="out7"></p>
      </section>
      <section>
        <h2>⑧ 犬の写真をランダムに表示する</h2>
        <button id="btn8">写真を表示</button>
        <img id="out8" alt="" />
      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
