<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小テスト練習 | プログラミング論 2026</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.png" sizes="32x32" type="image/png">

<script>
  // 授業資料と同じ "theme" キーを読む（同じサイト内なので設定が共有される）
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") {
        document.documentElement.setAttribute("data-theme", t);
      }
    } catch (e) { /* 読めなくても既定の配色で動く */ }
  })();
</script>

<style>
  /* 配色とフォントは授業資料（../index.html）と同じ値 */
  :root {
    --ground: #FAF9F6;
    --surface: #FFFFFF;
    --surface-alt: #F1EFE9;
    --code-bg: #23262B;
    --code-ink: #E6E9EE;
    --code-dim: #8B93A1;
    --ink: #1A1A18;
    --ink-mid: #45443F;
    --ink-soft: #6E6C64;
    --rule: #E2DFD6;
    --rule-strong: #C9C4B7;
    --accent: #2B4C7E;
    --accent-ink: #233E68;
    --accent-soft: #E6ECF5;
    --mark: #A8760A;
    --mark-soft: #FAF1DC;
    --ok: #2F6B3A;
    --ok-soft: #E3F0E3;
    --ng: #A3322B;
    --ng-soft: #F8E4E1;
    --shadow: 0 1px 2px rgba(26, 26, 24, .04), 0 12px 30px -18px rgba(26, 26, 24, .2);

    --font-display: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "MS PMincho", serif;
    --font-ui: "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", "Noto Sans JP", "Meiryo", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Menlo", "Consolas", "Roboto Mono", monospace;

    --nav-h: 3.25rem;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #191817;
      --surface: #212020;
      --surface-alt: #2A2927;
      --code-bg: #131518;
      --code-ink: #DDE2E8;
      --code-dim: #7A828F;
      --ink: #EDEBE6;
      --ink-mid: #BEBAB2;
      --ink-soft: #918C84;
      --rule: #333230;
      --rule-strong: #4A4844;
      --accent: #7BA3DC;
      --accent-ink: #97B8E8;
      --accent-soft: #1C2836;
      --mark: #E0A93F;
      --mark-soft: #322710;
      --ok: #7CC28A;
      --ok-soft: #18281B;
      --ng: #EC8A80;
      --ng-soft: #331B19;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px -18px rgba(0, 0, 0, .7);
    }
  }

  :root[data-theme="dark"] {
    --ground: #191817;
    --surface: #212020;
    --surface-alt: #2A2927;
    --code-bg: #131518;
    --code-ink: #DDE2E8;
    --code-dim: #7A828F;
    --ink: #EDEBE6;
    --ink-mid: #BEBAB2;
    --ink-soft: #918C84;
    --rule: #333230;
    --rule-strong: #4A4844;
    --accent: #7BA3DC;
    --accent-ink: #97B8E8;
    --accent-soft: #1C2836;
    --mark: #E0A93F;
    --mark-soft: #322710;
    --ok: #7CC28A;
    --ok-soft: #18281B;
    --ng: #EC8A80;
    --ng-soft: #331B19;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px -18px rgba(0, 0, 0, .7);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 16px;
    line-height: 1.85;
    margin: 0;
    padding: 0 0 6rem;
    -webkit-font-smoothing: antialiased;
  }

  [hidden] { display: none !important; }

  /* ---------- nav ---------- */

  nav.jump {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--ground);
    border-bottom: 1px solid var(--rule);
    height: var(--nav-h);
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: 0 1rem;
  }

  .theme-toggle {
    flex: none;
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    font-family: var(--font-mono);
    font-size: .72rem;
    letter-spacing: .04em;
    color: var(--ink-soft);
    background: var(--ground);
    border: 1px solid var(--rule-strong);
    border-radius: 999px;
    padding: .25rem .6rem;
    cursor: pointer;
    white-space: nowrap;
  }

  .theme-toggle:hover { color: var(--ink); background: var(--surface-alt); }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .theme-toggle > span { display: inline-flex; align-items: center; gap: .35rem; }
  .theme-toggle svg { width: .95em; height: .95em; flex: none; }
  .theme-toggle .to-light { display: none; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-toggle .to-dark  { display: none; }
    :root:not([data-theme="light"]) .theme-toggle .to-light { display: inline-flex; }
  }

  :root[data-theme="dark"] .theme-toggle .to-dark  { display: none; }
  :root[data-theme="dark"] .theme-toggle .to-light { display: inline-flex; }

  /* ---------- layout ---------- */

  .wrap {
    max-width: 44rem;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  .masthead {
    padding: 3.5rem 0 1.75rem;
    border-bottom: 3px double var(--rule-strong);
    display: flex;
    flex-direction: column;
    gap: .9rem;
  }

  .kicker {
    font-family: var(--font-mono);
    font-size: .74rem;
    letter-spacing: .16em;
    font-weight: 600;
    color: var(--accent-ink);
    margin: 0;
  }

  .masthead h1 {
    font-family: var(--font-display);
    font-size: clamp(1.9rem, 6vw, 2.6rem);
    font-weight: 600;
    line-height: 1.35;
    margin: 0;
  }

  .masthead p { margin: 0; color: var(--ink-mid); font-size: .95rem; }

  section.view {
    scroll-margin-top: calc(var(--nav-h) + .5rem);
    padding-top: 2.25rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  h2 {
    font-size: 1.12rem;
    font-weight: 700;
    line-height: 1.55;
    margin: .5rem 0 0;
    padding-bottom: .4rem;
    border-bottom: 1px solid var(--rule-strong);
  }

  p { margin: 0; }

  a { color: var(--accent-ink); text-underline-offset: .2em; }

  code {
    font-family: var(--font-mono);
    font-size: .87em;
    background: var(--surface-alt);
    padding: .1em .35em;
    border-radius: 3px;
    word-break: break-word;
  }

  .note {
    background: var(--accent-soft);
    border-radius: 4px;
    padding: .85rem 1.05rem;
    font-size: .92rem;
    line-height: 1.75;
  }

  .note.mark { background: var(--mark-soft); }

  /* ---------- 成績のまとめ ---------- */

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .75rem;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: .8rem .9rem .7rem;
    display: flex;
    flex-direction: column;
    gap: .1rem;
  }

  .stat .label { font-size: .78rem; color: var(--ink-soft); }
  .stat .value { font-family: var(--font-mono); font-size: 1.55rem; font-weight: 600; line-height: 1.3; }
  .stat .value small { font-size: .8rem; color: var(--ink-soft); font-weight: 400; }
  .stat.review .value { color: var(--ng); }
  .stat.mastered .value { color: var(--ok); }

  .topics {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: .55rem;
  }

  .topics li {
    display: grid;
    grid-template-columns: 1fr 6.5rem 3.2rem;
    align-items: center;
    gap: .75rem;
    font-size: .9rem;
  }

  .bar {
    height: .5rem;
    background: var(--surface-alt);
    border-radius: 999px;
    overflow: hidden;
    display: flex;
  }

  .bar span { display: block; height: 100%; }
  .bar .ok { background: var(--ok); }
  .bar .ng { background: var(--ng); }

  .topics .count { font-family: var(--font-mono); font-size: .8rem; color: var(--ink-soft); text-align: right; }

  .legend { font-size: .8rem; color: var(--ink-soft); display: flex; gap: 1rem; flex-wrap: wrap; }
  .legend i { display: inline-block; width: .7rem; height: .7rem; border-radius: 2px; margin-right: .3rem; vertical-align: -.05rem; }

  /* ---------- ボタン ---------- */

  .actions { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }

  button.primary, button.secondary {
    font-family: var(--font-ui);
    font-size: 1rem;
    font-weight: 700;
    border-radius: 6px;
    padding: .7rem 1.5rem;
    cursor: pointer;
    min-height: 2.9rem;
  }

  button.primary {
    color: #fff;
    background: var(--accent);
    border: 1px solid var(--accent);
  }

  :root[data-theme="dark"] button.primary { color: #111; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) button.primary { color: #111; }
  }

  button.primary:hover { filter: brightness(1.08); }
  button.primary:disabled { opacity: .45; cursor: not-allowed; filter: none; }

  button.secondary {
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
  }

  button.secondary:hover { background: var(--surface-alt); }

  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .plan { font-size: .9rem; color: var(--ink-mid); }

  /* ---------- 出題画面 ---------- */

  .q-head {
    display: flex;
    align-items: center;
    gap: .6rem;
    flex-wrap: wrap;
  }

  .progress {
    font-family: var(--font-mono);
    font-size: .8rem;
    letter-spacing: .08em;
    font-weight: 600;
    color: var(--accent-ink);
  }

  .tag {
    font-size: .75rem;
    border-radius: 999px;
    padding: .05rem .6rem;
    background: var(--surface-alt);
    color: var(--ink-mid);
  }

  .tag.review { background: var(--ng-soft); color: var(--ng); font-weight: 700; }
  .tag.new { background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }

  .question { font-size: 1.08rem; font-weight: 700; line-height: 1.75; }

  .code {
    background: var(--code-bg);
    border-radius: 5px;
    box-shadow: var(--shadow);
    overflow-x: auto;
  }

  .code pre {
    margin: 0;
    padding: .95rem 1.1rem;
    font-family: var(--font-mono);
    font-size: .86rem;
    line-height: 1.7;
    color: var(--code-ink);
    tab-size: 2;
  }

  .code pre code { background: none; padding: 0; font-size: inherit; color: inherit; word-break: normal; }

  .choices { display: flex; flex-direction: column; gap: .55rem; border: 0; margin: 0; padding: 0; }

  .choice {
    display: flex;
    align-items: flex-start;
    gap: .7rem;
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 6px;
    padding: .7rem .9rem;
    cursor: pointer;
    line-height: 1.65;
  }

  .choice:hover { border-color: var(--ink-soft); }
  .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .choice:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

  .choice input { margin: .35rem 0 0; flex: none; accent-color: var(--accent); }
  .choice .letter { font-family: var(--font-mono); font-weight: 600; color: var(--ink-soft); flex: none; }
  .choice .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .choice.mono .text { font-family: var(--font-mono); font-size: .9rem; }
  .choice.mono .text code { background: none; padding: 0; font-size: inherit; }

  .choices.locked .choice { cursor: default; }
  .choices.locked .choice:hover { border-color: var(--rule-strong); }
  .choice.is-correct { border-color: var(--ok) !important; background: var(--ok-soft) !important; }
  .choice.is-wrong { border-color: var(--ng) !important; background: var(--ng-soft) !important; }

  .feedback {
    border-radius: 6px;
    padding: .9rem 1.05rem;
    display: flex;
    flex-direction: column;
    gap: .45rem;
    font-size: .95rem;
    line-height: 1.8;
  }

  .feedback.ok { background: var(--ok-soft); }
  .feedback.ng { background: var(--ng-soft); }
  .feedback .verdict { font-weight: 700; font-size: 1.05rem; }
  .feedback.ok .verdict { color: var(--ok); }
  .feedback.ng .verdict { color: var(--ng); }
  .feedback .hint { font-size: .85rem; color: var(--ink-soft); }

  /* ---------- 結果画面 ---------- */

  .score {
    font-family: var(--font-display);
    font-size: clamp(2rem, 8vw, 2.8rem);
    font-weight: 600;
    line-height: 1.3;
  }

  .score small { font-family: var(--font-ui); font-size: 1rem; color: var(--ink-soft); font-weight: 400; margin-left: .4rem; }

  .review-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }

  .review-list li {
    display: grid;
    grid-template-columns: 1.6rem 1fr;
    gap: .5rem;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: .6rem .8rem;
    font-size: .92rem;
    line-height: 1.7;
  }

  .review-list .mark-ok { color: var(--ok); font-weight: 700; }
  .review-list .mark-ng { color: var(--ng); font-weight: 700; }
  .review-list .topic { display: block; font-size: .78rem; color: var(--ink-soft); }

  .history { font-size: .85rem; color: var(--ink-soft); }

  footer.foot {
    margin-top: 3.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    display: flex;
    flex-wrap: wrap;
    gap: .75rem 1.25rem;
    align-items: center;
    font-size: .85rem;
    color: var(--ink-soft);
  }

  button.link {
    font: inherit;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    padding: .3rem .7rem;
    cursor: pointer;
  }

  button.link:hover { color: var(--ink); }
  button.link.armed { color: var(--ng); border-color: var(--ng); font-weight: 700; }

  @media (max-width: 34rem) {
    body { font-size: 15.5px; }
    .wrap { padding: 0 1rem; }
    .masthead { padding-top: 2.25rem; }
    .stats { gap: .5rem; }
    .stat { padding: .65rem .7rem .55rem; }
    .stat .value { font-size: 1.3rem; }
    .topics li { grid-template-columns: 1fr 4.5rem 2.8rem; gap: .5rem; }
    .actions button { flex: 1 1 100%; }
  }
</style>
</head>

<nav class="jump">
  <button class="theme-toggle" type="button" data-theme-toggle>
    <span class="to-dark"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M13.4 9.6A5.8 5.8 0 0 1 6.4 2.6 5.8 5.8 0 1 0 13.4 9.6Z"/></svg>ダーク</span>
    <span class="to-light"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2 3.1 3.1"/></svg>ライト</span>
  </button>
</nav>

<div class="wrap">

  <header class="masthead">
    <p class="kicker">プログラミング論及び演習　小テスト対策</p>
    <h1>小テスト練習</h1>
    <p>小テストの出題範囲（JavaScriptの基本言語仕様）から、50問の中から5問ずつ出題します。本番と同じ4択です。</p>
  </header>

  <!-- ========== ホーム ========== -->
  <section class="view" id="home">
    <div class="stats">
      <div class="stat"><span class="label">出題済み</span><span class="value" id="statSeen"></span></div>
      <div class="stat mastered"><span class="label">正解済み</span><span class="value" id="statOk"></span></div>
      <div class="stat review"><span class="label">要復習</span><span class="value" id="statNg"></span></div>
    </div>

    <div class="note mark">
      <strong>出題のしくみ：</strong>まだ解いていない問題と、前回まちがえた問題から5問を選びます。まちがえた問題は、正解するまで何度でも出てきます。記録はこのブラウザにだけ保存されます（別のPCやスマホとは共有されません）。
    </div>

    <div class="actions">
      <button class="primary" type="button" id="startBtn">5問に挑戦する</button>
      <span class="plan" id="planText"></span>
    </div>

    <h2>出題範囲と達成状況</h2>
    <ul class="topics" id="topicList"></ul>
    <p class="legend">
      <span><i style="background: var(--ok)"></i>正解済み</span>
      <span><i style="background: var(--ng)"></i>要復習</span>
      <span><i style="background: var(--surface-alt); border: 1px solid var(--rule-strong)"></i>未出題</span>
    </p>
    <p class="history" id="historyText"></p>
  </section>

  <!-- ========== 出題 ========== -->
  <section class="view" id="play" hidden>
    <div class="q-head">
      <span class="progress" id="progress"></span>
      <span class="tag" id="topicTag"></span>
      <span class="tag" id="kindTag"></span>
    </div>
    <p class="question" id="question"></p>
    <div class="code" id="codeBox" hidden><pre><code id="code"></code></pre></div>
    <fieldset class="choices" id="choices"></fieldset>
    <div class="feedback" id="feedback" hidden></div>
    <div class="actions">
      <button class="primary" type="button" id="answerBtn" disabled>回答する</button>
      <button class="primary" type="button" id="nextBtn" hidden>次の問題へ</button>
    </div>
  </section>

  <!-- ========== 結果 ========== -->
  <section class="view" id="result" hidden>
    <h2>結果</h2>
    <p class="score" id="score"></p>
    <ul class="review-list" id="reviewList"></ul>
    <div class="actions">
      <button class="primary" type="button" id="againBtn">次の5問に挑戦する</button>
      <button class="secondary" type="button" id="homeBtn">達成状況を見る</button>
    </div>
  </section>

  <footer class="foot">
    <span id="storageNote">記録はこのブラウザのローカルストレージに保存されます。</span>
    <button class="link" type="button" id="resetBtn">記録をリセット</button>
  </footer>
</div>

<script>
"use strict";

// =====================================================================
//  問題データ（オブジェクトの配列）
//    id       : 記録に使う名前。並べ替えても記録がずれないよう番号ではなく名前にする
//    topic    : 出題範囲（下の TOPICS のキー）
//    question : 問題文。`…` で囲んだ部分はコードとして表示
//    code     : コード（無ければ省略）
//    choices  : 選択肢。表示するときに順番をシャッフルする
//    mono     : true なら選択肢全体をコードの書体で表示
//    answer   : choices の何番目が正解か（0から数える）
//    explain  : 解説
// =====================================================================

const TOPICS = {
  var:     "let, const などの変数宣言",
  syntax:  "基本構文（for, if, 関数, 演算子）",
  scope:   "変数の有効範囲",
  data:    "配列とオブジェクト",
  dom:     "querySelector と DOM の操作",
  date:    "Dateオブジェクト",
  storage: "ローカルストレージ",
  async:   "非同期通信（async / await / fetch）"
};

const QUESTIONS = [
  // ---------------- 変数宣言 ----------------
  {
    id: "var-const-reassign",
    topic: "var",
    question: "次のコードを実行するとどうなりますか。",
    code: `"use strict";
const x = 5;
x = 10;
console.log(x);`,
    choices: ["10 と表示される", "5 と表示される", "エラーになる", "undefined と表示される"],
    answer: 2,
    explain: "`const` で宣言した変数には再代入できません。3行目で TypeError（Assignment to constant variable）が発生し、`console.log` まで到達しません。値を変えたい変数は `let` で宣言します。"
  },
  {
    id: "var-let-rule",
    topic: "var",
    question: "後で `count++` で値を増やしていく変数 `count` の宣言として最も適切なものはどれですか。",
    choices: ["let count = 0;", "const count = 0;", "int count = 0;", "count := 0;"],
    mono: true,
    answer: 0,
    explain: "`count++` も再代入の一種なので `let` で宣言します。`const` で宣言すると `count++` の行でエラーになります。まず `const` で書き、再代入が必要になったものだけ `let` に変えると、値が変わる変数が一目でわかります。`int` は型を宣言する言語（C言語など）の書き方で、JavaScriptでは使いません。"
  },
  {

// =====================================================================
//  設定
// =====================================================================

const QUIZ_SIZE = 5;         // 1回に出す問題数
const REVIEW_MAX = 2;        // 1回のうち、まちがえた問題を優先して入れる最大数
const STORAGE_KEY = "otsuma-prog-quiz1";

// =====================================================================
//  記録の読み書き（JSON.stringify / JSON.parse で往復する）
//    records : { 問題のid: { tries: 解いた回数, correct: 正解した回数, last: 直近が正解か, at: 日時 } }
//    runs    : [{ date: "2026/11/20 10:23", score: 4, total: 5 }, ...]
// =====================================================================

let canSave = true;

function loadStore() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) ?? "{}");
    return {
      records: data.records ?? {},
      runs: Array.isArray(data.runs) ? data.runs : []
    };
  } catch (error) {
    // 保存できない環境（プライベートモードなど）や、壊れたデータのとき
    canSave = false;
    return { records: {}, runs: [] };
  }
}

function saveStore() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
  } catch (error) {
    canSave = false;
  }
}

let store = loadStore();

// =====================================================================
//  出題する5問を選ぶ
//    1. 前回まちがえた問題（直近の回答が不正解）から最大 REVIEW_MAX 問
//    2. まだ出題していない問題で残りを埋める
//    3. 足りなければ、まちがえた問題をさらに足す
//    4. それでも足りなければ（全問正解済み）、正解済みの問題を古い順に
// =====================================================================

function shuffle(array) {
  const a = array.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makePlan() {
  const wrong = [];
  const fresh = [];
  const mastered = [];

  QUESTIONS.forEach(function (q) {
    const rec = store.records[q.id];
    if (!rec) fresh.push(q);
    else if (rec.last === false) wrong.push(q);
    else mastered.push(q);
  });

  const wrongList = shuffle(wrong);
  const freshList = shuffle(fresh);
  // 正解済みは、前に解いたのが古いものから
  const masteredList = mastered.slice().sort(function (a, b) {
    return store.records[a.id].at - store.records[b.id].at;
  });

  const picked = [];
  function take(list, max, kind) {
    while (picked.length < QUIZ_SIZE && max > 0 && list.length > 0) {
      picked.push({ q: list.shift(), kind: kind });
      max--;
    }
  }

  take(wrongList, REVIEW_MAX, "review");
  take(freshList, QUIZ_SIZE, "new");
  take(wrongList, QUIZ_SIZE, "review");
  take(masteredList, QUIZ_SIZE, "again");

  return shuffle(picked);
}

// =====================================================================
//  画面の部品
// =====================================================================

const homeView   = document.querySelector("#home");
const playView   = document.querySelector("#play");
const resultView = document.querySelector("#result");

const progressEl = document.querySelector("#progress");
const topicTagEl = document.querySelector("#topicTag");
const kindTagEl  = document.querySelector("#kindTag");
const questionEl = document.querySelector("#question");
const codeBoxEl  = document.querySelector("#codeBox");
const codeEl     = document.querySelector("#code");
const choicesEl  = document.querySelector("#choices");
const feedbackEl = document.querySelector("#feedback");
const answerBtn  = document.querySelector("#answerBtn");
const nextBtn    = document.querySelector("#nextBtn");

let plan = [];       // 今回の5問 [{ q, kind }]
let count = 0;       // 今何問目か（0から数える）
let results = [];    // 今回の正誤 [true, false, ...]

// `…` で囲んだ部分を <code> にする。innerHTML を使わず要素を組み立てるので、
// 問題文に < や > が入っていてもタグとして解釈されない
function renderInline(el, text) {
  el.textContent = "";
  text.split("`").forEach(function (part, i) {
    if (part === "") return;
    if (i % 2 === 1) {
      const c = document.createElement("code");
      c.textContent = part;
      el.appendChild(c);
    } else {
      el.appendChild(document.createTextNode(part));
    }
  });
}

function show(view) {
  [homeView, playView, resultView].forEach(function (v) {
    v.hidden = v !== view;
  });
  scrollToView(view);
}

// ホームはページの先頭へ、出題・結果は見出しを飛ばしてその画面の先頭へ
function scrollToView(view) {
  if (view === homeView) window.scrollTo(0, 0);
  else view.scrollIntoView();
}

// =====================================================================
//  ホーム画面
// =====================================================================

function renderHome() {
  let seen = 0;
  let ok = 0;
  let ng = 0;
  QUESTIONS.forEach(function (q) {
    const rec = store.records[q.id];
    if (!rec) return;
    seen++;
    if (rec.last) ok++;
    else ng++;
  });

  const total = QUESTIONS.length;
  document.querySelector("#statSeen").innerHTML = `${seen}<small> / ${total}</small>`;
  document.querySelector("#statOk").innerHTML   = `${ok}<small> / ${total}</small>`;
  document.querySelector("#statNg").textContent = ng;

  // 出題範囲ごとの達成状況
  const listEl = document.querySelector("#topicList");
  listEl.innerHTML = "";
  Object.keys(TOPICS).forEach(function (key) {
    const qs = QUESTIONS.filter(q => q.topic === key);
    const okN = qs.filter(q => store.records[q.id]?.last === true).length;
    const ngN = qs.filter(q => store.records[q.id]?.last === false).length;

    const li = document.createElement("li");
    const name = document.createElement("span");
    name.textContent = TOPICS[key];
    const bar = document.createElement("span");
    bar.className = "bar";
    bar.innerHTML =
      `<span class="ok" style="width:${okN / qs.length * 100}%"></span>` +
      `<span class="ng" style="width:${ngN / qs.length * 100}%"></span>`;
    const cnt = document.createElement("span");
    cnt.className = "count";
    cnt.textContent = `${okN}/${qs.length}`;
    li.append(name, bar, cnt);
    listEl.appendChild(li);
  });

  // 次の5問の内訳
  plan = makePlan();
  const nNew = plan.filter(p => p.kind === "new").length;
  const nReview = plan.filter(p => p.kind === "review").length;
  const nAgain = plan.filter(p => p.kind === "again").length;
  const parts = [];
  if (nNew) parts.push(`新しい問題 ${nNew}問`);
  if (nReview) parts.push(`まちがえた問題 ${nReview}問`);
  if (nAgain) parts.push(`正解済みの問題 ${nAgain}問`);
  let planText = "次は " + parts.join("・");
  if (ok === total) planText = "全問正解済みです。" + planText + "をもう一度";
  document.querySelector("#planText").textContent = planText;

  // これまでの挑戦
  const historyEl = document.querySelector("#historyText");
  if (store.runs.length === 0) {
    historyEl.textContent = "";
  } else {
    const recent = store.runs.slice(-5).reverse()
      .map(r => `${r.date}（${r.score}/${r.total}）`)
      .join("、");
    historyEl.textContent = `これまで ${store.runs.length} 回挑戦。最近の記録：${recent}`;
  }

  document.querySelector("#storageNote").textContent = canSave
    ? "記録はこのブラウザのローカルストレージに保存されます。"
    : "このブラウザでは記録を保存できません（プライベートモードなど）。ページを閉じると記録は消えます。";

  show(homeView);
}

// =====================================================================
//  出題
// =====================================================================

function startQuiz() {
  if (plan.length === 0) plan = makePlan();
  count = 0;
  results = [];
  showQuestion();
  show(playView);
}

function showQuestion() {
  const item = plan[count];
  const q = item.q;

  progressEl.textContent = `問題 ${count + 1} / ${plan.length}`;
  topicTagEl.textContent = TOPICS[q.topic];
  kindTagEl.className = "tag";
  if (item.kind === "review") {
    kindTagEl.textContent = "前回まちがえた問題";
    kindTagEl.classList.add("review");
    kindTagEl.hidden = false;
  } else if (item.kind === "new") {
    kindTagEl.textContent = "新しい問題";
    kindTagEl.classList.add("new");
    kindTagEl.hidden = false;
  } else {
    kindTagEl.hidden = true;
  }

  renderInline(questionEl, q.question);

  if (q.code) {
    codeEl.textContent = q.code;
    codeBoxEl.hidden = false;
  } else {
    codeBoxEl.hidden = true;
  }

  // 選択肢は表示する順番だけシャッフルする。value には元の番号を入れておくので、
  // 正誤判定は Number(picked.value) === q.answer でできる
  choicesEl.innerHTML = "";
  choicesEl.classList.remove("locked");
  const order = shuffle(q.choices.map((_, i) => i));
  order.forEach(function (originalIndex, pos) {
    const label = document.createElement("label");
    label.className = "choice" + (q.mono ? " mono" : "");

    const input = document.createElement("input");
    input.type = "radio";
    input.name = "answer";
    input.value = originalIndex;
    input.addEventListener("change", function () {
      answerBtn.disabled = false;
    });

    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = "abcd"[pos] + ".";

    const text = document.createElement("span");
    text.className = "text";
    if (q.mono) text.textContent = q.choices[originalIndex];
    else renderInline(text, q.choices[originalIndex]);

    label.append(input, letter, text);
    choicesEl.appendChild(label);
  });

  feedbackEl.hidden = true;
  answerBtn.hidden = false;
  answerBtn.disabled = true;
  nextBtn.hidden = true;
}

answerBtn.addEventListener("click", function () {
  const picked = document.querySelector('input[name="answer"]:checked');
  if (!picked) return;

  const q = plan[count].q;
  const ok = Number(picked.value) === q.answer;
  results.push(ok);

  // 1問ごとに記録する（途中でやめても、解いた分は残る）
  const rec = store.records[q.id] ?? { tries: 0, correct: 0 };
  rec.tries++;
  if (ok) rec.correct++;
  rec.last = ok;
  rec.at = Date.now();
  store.records[q.id] = rec;
  saveStore();

  // 選択肢に色を付けて、選べないようにする
  choicesEl.classList.add("locked");
  choicesEl.querySelectorAll("label").forEach(function (label) {
    const input = label.querySelector("input");
    input.disabled = true;
    const idx = Number(input.value);
    if (idx === q.answer) label.classList.add("is-correct");
    else if (idx === Number(picked.value)) label.classList.add("is-wrong");
  });

  // 正誤と解説
  feedbackEl.innerHTML = "";
  feedbackEl.className = "feedback " + (ok ? "ok" : "ng");
  const verdict = document.createElement("p");
  verdict.className = "verdict";
  verdict.textContent = ok ? "正解！" : "不正解";
  const explain = document.createElement("p");
  renderInline(explain, q.explain);
  feedbackEl.append(verdict, explain);
  if (!ok) {
    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "この問題は次回以降にもう一度出題されます。";
    feedbackEl.appendChild(hint);
  }
  feedbackEl.hidden = false;

  answerBtn.hidden = true;
  nextBtn.textContent = count + 1 < plan.length ? "次の問題へ" : "結果を見る";
  nextBtn.hidden = false;
  nextBtn.focus();
});

nextBtn.addEventListener("click", function () {
  count++;
  if (count < plan.length) {
    showQuestion();
    scrollToView(playView);
  } else {
    showResult();
  }
});

// =====================================================================
//  結果
// =====================================================================

function formatDate(d) {
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${pad(d.getMinutes())}`;
}

function showResult() {
  const score = results.filter(r => r).length;
  store.runs.push({ date: formatDate(new Date()), score: score, total: plan.length });
  saveStore();

  document.querySelector("#score").innerHTML =
    `${score} / ${plan.length}<small>問正解</small>`;

  const listEl = document.querySelector("#reviewList");
  listEl.innerHTML = "";
  plan.forEach(function (item, i) {
    const li = document.createElement("li");
    const mark = document.createElement("span");
    mark.className = results[i] ? "mark-ok" : "mark-ng";
    mark.textContent = results[i] ? "○" : "×";
    mark.setAttribute("aria-label", results[i] ? "正解" : "不正解");
    const body = document.createElement("span");
    const topic = document.createElement("span");
    topic.className = "topic";
    topic.textContent = TOPICS[item.q.topic];
    const text = document.createElement("span");
    renderInline(text, item.q.question);
    body.append(topic, text);
    li.append(mark, body);
    listEl.appendChild(li);
  });

  plan = [];
  show(resultView);
}

document.querySelector("#startBtn").addEventListener("click", startQuiz);
document.querySelector("#againBtn").addEventListener("click", function () {
  plan = makePlan();
  startQuiz();
});
document.querySelector("#homeBtn").addEventListener("click", renderHome);

// 記録のリセット。確認ダイアログを出さず、2回押すと消える方式にする
const resetBtn = document.querySelector("#resetBtn");
let resetTimer = null;
resetBtn.addEventListener("click", function () {
  if (!resetBtn.classList.contains("armed")) {
    resetBtn.classList.add("armed");
    resetBtn.textContent = "もう一度押すとすべての記録を消します";
    resetTimer = setTimeout(function () {
      resetBtn.classList.remove("armed");
      resetBtn.textContent = "記録をリセット";
    }, 4000);
    return;
  }
  clearTimeout(resetTimer);
  try { localStorage.removeItem(STORAGE_KEY); } catch (error) { /* 消せなくても画面は初期化する */ }
  store = { records: {}, runs: [] };
  resetBtn.classList.remove("armed");
  resetBtn.textContent = "記録をリセット";
  renderHome();
});

renderHome();

// ---- 明るい配色 / 暗い配色の切り替え（授業資料と同じ） ----
(function () {
  const root = document.documentElement;
  const btn = document.querySelector("[data-theme-toggle]");
  const dark = window.matchMedia("(prefers-color-scheme: dark)");

  function current() {
    const chosen = root.getAttribute("data-theme");
    if (chosen === "dark" || chosen === "light") return chosen;
    return dark.matches ? "dark" : "light";
  }

  function describe() {
    const next = current() === "dark" ? "ライト" : "ダーク";
    btn.setAttribute("aria-label", next + "モードに切り替える");
    btn.title = next + "モードに切り替える";
  }

  btn.addEventListener("click", function () {
    const next = current() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) { /* 保存できなくても切り替えは効く */ }
    describe();
  });

  if (dark.addEventListener) dark.addEventListener("change", describe);
  describe();
})();
</script>
